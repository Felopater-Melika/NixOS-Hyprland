# FIXME: Confirm connector names on first boot with `hyprctl monitors`.
# FIXME: Swap DP-1/DP-2 if the monitors come up reversed.
# Main 49" display on the left.
monitor = DP-1, preferred, 0x0, 1

# FIXME: This offset assumes the left display is 5120 logical pixels wide.
# FIXME: Change 5120x0 if your ultrawide uses a different width or scaling.
# Secondary 24" display on the right.
# If your ultrawide is not 5120-wide, change the X offset after first boot.
monitor = DP-2, preferred, 5120x0, 1

# Fallback for anything else you plug in later.
monitor = , preferred, auto, 1
